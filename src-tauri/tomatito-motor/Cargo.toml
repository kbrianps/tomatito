[package]
name = "tomatito-motor"
version = "0.1.0"
description = "Motor do Tomatito compartilhado pelo desktop e pela web (eventos, textos, configurações, tarefas e estado), sem Tauri"
authors = ["kbrianps"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

# PLANO-WEB, 3.3: o que o desktop e o tomatito-wasm usam igual. Só o
# tomatito-core, o serde e o serde_json (o patch das configurações, W04b):
# nada de tauri, tokio, rusqlite ou rodio, para compilar também em
# wasm32-unknown-unknown.
[dependencies]
tomatito-core = { path = "../tomatito-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Fusos fixos no teste da virada do dia (tasks.rs), como no desktop.
jiff = "0.2.37"
