[package]
name = "tomatito-core"
version = "0.1.0"
description = "Motor do Tomatito (plano da sessão, relógio e estados), sem Tauri"
authors = ["kbrianps"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

# Regra de isolamento (PLANO.md, 3.2): nada de tauri, wry, tao, gtk ou webkit2gtk
# aqui, nem direta nem indiretamente. `cargo test -p tomatito-core` compila só o
# núcleo. O teste em tests/isolamento.rs confere a árvore inteira, pelo
# `cargo tree -p tomatito-core --target all -e normal,build,dev`.
[dependencies]
# Horas e datas locais (3.6 e 3.8): o "às 14:35" das notificações (M21) e,
# depois, os dias com a hora de zerar (days.rs).
jiff = "0.2.37"
