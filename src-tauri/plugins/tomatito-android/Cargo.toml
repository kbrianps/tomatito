[package]
name = "tauri-plugin-tomatito-android"
version = "0.1.0"
authors = ["kbrianps"]
description = "A parte Android do Tomatito: avisos, alarmes e barras do sistema (PLANO-ANDROID 4.2)"
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false
links = "tauri-plugin-tomatito-android"

# Gerado por `tauri plugin new tomatito-android --android --no-api --no-example`
# (A07a) e reduzido: sem iOS, sem API em TypeScript (o JS chama
# `plugin:tomatito-android|<comando>` pelo `invoke`), sem o braço de desktop.
# O app só depende dele no Android; no desktop ele entra no `cargo --workspace`
# (dependência por caminho dentro do workspace) e compila vazio.

[dependencies]
tauri = { version = "=2.12.0" }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "=2.7.0", features = ["build"] }
