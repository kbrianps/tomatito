<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tomatito, fundo do ícone adaptativo do Android (A15): o degradê do disco
       do icon.svg, ocupando a camada inteira (o sistema recorta a forma). -->
  <defs>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DD634B"/>
      <stop offset="1" stop-color="#B8402D"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#corpo)"/>
</svg>
