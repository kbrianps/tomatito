# cargo-about (M46): os avisos dos crates que entram no app, gerados por
# `node scripts/gerar-avisos.mjs` para o THIRD_PARTY_NOTICES.md da raiz.
# Só os dois sistemas do app, e só as dependências normais: as de build e as
# de teste não vão no binário.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
]
