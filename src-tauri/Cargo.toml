[package]
name = "tomatito"
version = "0.1.0"
description = "Timer de foco para Windows e Linux"
authors = ["kbrianps"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[workspace]
members = ["tomatito-core"]

[lib]
name = "tomatito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.0", features = [] }

# Região de entrada da janela `tomato` no Wayland (PLANO.md, 5.6). A mesma
# versão do gtk que o Tauri já usa; no Windows a região é do M55.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
