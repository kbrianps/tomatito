[package]
name = "tomatito"
version = "0.1.0"
description = "Timer de foco para Windows e Linux"
authors = ["kbrianps"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[workspace]
members = ["tomatito-core"]

[lib]
name = "tomatito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.0", features = [] }
