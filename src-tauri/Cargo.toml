[package]
name = "tomatito"
version = "0.1.0"
description = "Timer de foco para Windows e Linux"
authors = ["kbrianps"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[workspace]
# tomatito-wasm: a ponte do core para o navegador (versão web, PLANO-WEB 3.3).
# O app não depende dela; só o `npm run wasm` a compila para wasm32.
members = ["tomatito-core", "tomatito-wasm"]

# Perfil só do pacote web (`npm run wasm`, wasm-pack --profile wasm-release):
# não mexe no `release` do app desktop.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[lib]
name = "tomatito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# A bandeja (M36) vem do próprio Tauri: `tray-icon`, e o ícone em PNG.
tauri = { version = "=2.12.0", features = ["tray-icon", "image-png"] }
tomatito-core = { path = "tomatito-core" }
# O laço do motor (engine.rs): interval e Notify. É o mesmo tokio do Tauri.
tokio = { version = "1.53", features = ["time", "sync", "macros"] }
# Som (audio.rs, M20). Só a saída (cpal) e o WAV pelo hound: sem os
# decodificadores do symphonia nem a gravação (docs/decisoes.md, M20).
rodio = { version = "0.22.2", default-features = false, features = ["playback", "hound"] }
# Estatísticas (stats.rs, M26): o SQLite vem compilado junto (`bundled`),
# para não depender da versão do sistema nem de uma DLL no Windows (3.3).
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Instância única e estado da janela (M37), nas versões da 3.6. O
# single-instance fala pelo D-Bus no Linux (o mesmo zbus do notify.rs, com o
# `tokio`) e por uma janela de mensagens no Windows.
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-window-state = "=2.4.1"

[dev-dependencies]
# Testes do laço com o tempo do tokio parado (start_paused).
tokio = { version = "1.53", features = ["rt", "macros", "test-util"] }
# Fusos fixos nos testes das estatísticas (stats.rs); no app, o jiff só
# entra pelo tomatito-core.
jiff = "0.2.37"

# Notificações (notify.rs, M21), sempre do Rust e sem o pacote do JS (3.6).
# No Windows, pelo plugin (um toast). No Linux, uma chamada própria ao
# org.freedesktop.Notifications por uma conexão D-Bus que dura o app inteiro:
# o plugin abre uma conexão por aviso e a fecha na hora, e o GNOME Shell apaga
# a notificação quando a conexão de quem a mandou some (docs/decisoes.md, M21).
[target.'cfg(windows)'.dependencies]
tauri-plugin-notification = "=2.4.0"
# Região da `tomato` (window/region_windows.rs, M55): `SetWindowRgn` e a borda
# do DWM; e a versão do Windows (M56, `RtlGetVersion`). A mesma versão que o
# Tauri usa (3.6), senão o tipo `HWND` não bate.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Wdk_System_SystemServices", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# O gtk 0.18 que o Tauri já usa no Linux (3.6), senão o tipo da GtkWindow não
# bate: a região de entrada da `tomato` no nível do GtkWidget
# (window/region_linux.rs, M54) e o anúncio ao leitor de tela pelo ATK da
# janela (anuncio.rs, M43).
gtk = "0.18"
