[package]
name = "tomatito"
version = "0.1.0"
description = "Timer de foco para Windows e Linux"
authors = ["kbrianps"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[workspace]
members = ["tomatito-core"]

[lib]
name = "tomatito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.0", features = [] }
tomatito-core = { path = "tomatito-core" }
# O laço do motor (engine.rs): interval e Notify. É o mesmo tokio do Tauri.
tokio = { version = "1.53", features = ["time", "sync", "macros"] }
# Som (audio.rs, M20). Só a saída (cpal) e o WAV pelo hound: sem os
# decodificadores do symphonia nem a gravação (docs/decisoes.md, M20).
rodio = { version = "0.22.2", default-features = false, features = ["playback", "hound"] }
# Estatísticas (stats.rs, M26): o SQLite vem compilado junto (`bundled`),
# para não depender da versão do sistema nem de uma DLL no Windows (3.3).
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[dev-dependencies]
# Testes do laço com o tempo do tokio parado (start_paused).
tokio = { version = "1.53", features = ["rt", "macros", "test-util"] }
# Fusos fixos nos testes das estatísticas (stats.rs); no app, o jiff só
# entra pelo tomatito-core.
jiff = "0.2.37"

# Notificações (notify.rs, M21), sempre do Rust e sem o pacote do JS (3.6).
# No Windows, pelo plugin (um toast). No Linux, uma chamada própria ao
# org.freedesktop.Notifications por uma conexão D-Bus que dura o app inteiro:
# o plugin abre uma conexão por aviso e a fecha na hora, e o GNOME Shell apaga
# a notificação quando a conexão de quem a mandou some (docs/decisoes.md, M21).
[target.'cfg(windows)'.dependencies]
tauri-plugin-notification = "=2.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
