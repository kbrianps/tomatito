<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Boot sem clarão (PLANO.md, 4.7): o mesmo script do index.html. Na tomato, o tema é sempre full,
         e data-full-mode="opaque" só no plano B3 (M52). -->
    <script>(function(){var h=document.documentElement,w=window,p=w.__TT_PREF__||'lite';
var tomato=location.pathname.indexOf('tomato')>=0;
var cartao=tomato&&w.__TT_SKIN__==='card';
var base=tomato&&!cartao?'full':(p==='full'?(w.__TT_LAST__||'lite'):p);
var r=base==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):base;
h.dataset.themePref=p;h.dataset.theme=r;h.dataset.platform=w.__TT_PLATFORM__||'web';
if(cartao)h.dataset.skin='card';
if(tomato&&w.__TT_FULL_MODE__==='opaque')h.dataset.fullMode='opaque';})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomatito</title>
    <!-- Ordem da seção 4.2 do plano; no tomato.html, a última folha é o tomato.css. -->
    <link rel="stylesheet" href="/src/styles/fluent-tokens.gen.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/bridge.css" />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/tomato.css" />
  </head>
  <body>
    <!-- O tomate (PLANO.md, 5.10), portado do protótipo tomate-full.html. O arraste vem do
         data-tauri-drag-region="deep": o drag.js do Tauri sobe a partir do alvo, pula os nós SVG e
         para no .stage; os <button> bloqueiam o arraste. Os textos e os rótulos vêm do catálogo
         (src/lib/i18n/pt-BR.js), escritos pelo src/tomato.js. -->
    <div class="stage" data-state="idle" data-tauri-drag-region="deep">
      <svg class="art" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="g-body" class="body-fill" cx="0.36" cy="0.30" r="0.80">
            <stop offset="0" class="body-hi" />
            <stop offset="0.55" class="body-mid" />
            <stop offset="1" class="body-lo" />
          </radialGradient>
          <linearGradient id="g-depth" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0.55" class="depth-top" />
            <stop offset="1" class="depth-bottom" />
          </linearGradient>
          <filter id="f-shadow" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
            <feDropShadow class="drop" dx="0" dy="5" stdDeviation="5" />
          </filter>
          <!-- Corpo: 283 × 230 unidades, com a covinha do cabinho em (160,80). -->
          <path
            id="body-shape"
            d="M160 80 C190 64 236 62 268 86 C296 108 306 150 300 190 C293 252 236 298 160 298 C84 298 27 252 20 190 C14 150 24 108 52 86 C84 62 130 64 160 80 Z"
          />
        </defs>

        <!-- .shadowed: o CSS tira a sombra no Windows, onde a região cortaria (4.2). -->
        <g class="shadowed" filter="url(#f-shadow)">
          <use href="#body-shape" class="hit" fill="url(#g-body)" />
        </g>
        <use href="#body-shape" class="depth" fill="url(#g-depth)" />

        <!-- Anel: o contorno do corpo a 0,92 em torno de (160,185), pathLength=100, com as pontas
             sob as sépalas (5,5 de cada lado). -->
        <path
          class="ring-track"
          pathLength="100"
          d="M160 88.4 C187.6 73.7 229.9 71.8 259.4 93.9 C285.1 114.2 294.3 152.8 288.8 189.6 C282.4 246.6 229.9 289 160 289 C90.1 289 37.6 246.6 31.2 189.6 C25.7 152.8 34.9 114.2 60.6 93.9 C90.1 71.8 132.4 73.7 160 88.4 Z"
        />
        <path
          class="ring-progress"
          data-anel
          pathLength="100"
          d="M160 88.4 C187.6 73.7 229.9 71.8 259.4 93.9 C285.1 114.2 294.3 152.8 288.8 189.6 C282.4 246.6 229.9 289 160 289 C90.1 289 37.6 246.6 31.2 189.6 C25.7 152.8 34.9 114.2 60.6 93.9 C90.1 71.8 132.4 73.7 160 88.4 Z"
        />

        <!-- Cabinho, cortado na diagonal. -->
        <path class="stem" d="M155.5 88 C155 74 157 60 160.5 47.5 Q163.5 43 169 45.5 C166 58 164.8 72 165.5 88 Z" />

        <!-- Cálice: cinco sépalas, cada uma num <path> próprio, e a elipse da base. -->
        <g class="calyx">
          <path d="M166 83 Q190 66 216 77 Q192 92 164 91 Z" />
          <path d="M154 83 Q130 66 104 77 Q128 92 156 91 Z" />
          <path d="M155 90 Q148 100 147 113 Q158 105 165 91 Z" />
          <path d="M165 82 Q176 64 192 60 Q186 76 168 87 Z" />
          <path d="M155 82 Q140 64 126 62 Q134 76 152 87 Z" />
          <ellipse cx="160" cy="86" rx="13" ry="6.5" />
        </g>
        <path class="calyx-vein" d="M170 85 Q190 79 210 78 M150 85 Q130 79 110 78" />
      </svg>

      <!-- v0.4, modo compacto: o anel redondo do cartão (como a janelinha do Relógio do Windows), no
           lugar do tomate. Só aparece com data-skin="card" (tomato.css). O pathLength 89 é a faixa do
           --tt-anel (lib/tomate.js), e o traço começa no alto. -->
      <svg class="art-cartao" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
        <circle class="ring-track" cx="160" cy="140" r="108" />
        <circle class="ring-progress" data-anel-cartao pathLength="89" cx="160" cy="140" r="108" transform="rotate(-90 160 140)" />
      </svg>

      <div class="face">
        <p class="label" data-rotulo></p>
        <p class="time tt-num" role="timer" aria-live="off" data-tempo></p>
        <p class="count" data-contagem></p>

        <button class="btn pos-restore" type="button" data-acao="voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5" /><path d="M3.5 9.5h17" /></svg>
        </button>
        <button class="btn pos-settings" type="button" data-acao="configuracoes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2.75" /><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.55 1.55M7.55 16.45 6 18M18 18l-1.55-1.55M7.55 7.55 6 6" /><circle cx="12" cy="12" r="6.3" /></svg>
        </button>

        <!-- M50: "Reiniciar sessão" do protótipo virou "Encerrar sessão" (focus_stop), como no menu
             da tela Foco (docs/decisoes.md, M50). -->
        <button class="btn pos-reset" type="button" data-acao="encerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2" /></svg>
        </button>
        <button class="btn btn-primary pos-play" type="button" data-acao="principal">
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2" /><rect x="13.9" y="5" width="3.6" height="14" rx="1.2" /></svg>
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.2 5.3c0-.9 1-1.4 1.7-.9l9.1 6.2c.7.5.7 1.4 0 1.9l-9.1 6.2c-.7.5-1.7 0-1.7-.9z" /></svg>
        </button>
        <button class="btn pos-skip" type="button" data-acao="pular">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.6v10.8L14.6 12z" /><path d="M17.5 6.5v11" /></svg>
        </button>
      </div>
    </div>
    <!-- Anúncio das fases (3.8 e 5.10): a única região aria-live, escondida (src/lib/a11y.js). -->
    <p class="tt-anuncio" aria-live="polite" aria-atomic="true" data-anuncio></p>
    <script type="module" src="/src/tomato.js"></script>
  </body>
</html>
