# Repositório APT do Tomatito (v0.3): quando um release é publicado, monta o
# repositório com o .deb dele, assina e publica na branch gh-pages, que o
# GitHub Pages serve em https://kbrianps.github.io/tomatito/apt. Quem instalou
# o .deb recebe a versão nova pelo atualizador do sistema (o pacote leva a
# fonte e a chave pública; docs/atualizacoes.md).
#
# Para montar sem o GitHub: `bash scripts/apt/montar-repo.sh <debs> <saída>`.
name: APT

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Código
        uses: actions/checkout@v7

      # O .deb do último release publicado (o que acabou de sair).
      - name: Baixar o .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p debs
          gh release download --repo "${GITHUB_REPOSITORY}" --pattern '*.deb' --dir debs
          ls -l debs

      - name: Chave do repositório
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          [ -n "${APT_GPG_PRIVATE_KEY}" ] || { echo "::error::falta o segredo APT_GPG_PRIVATE_KEY"; exit 1; }
          printf '%s\n' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Montar e assinar
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils
          bash scripts/apt/montar-repo.sh debs site/apt
          cp packaging/apt/index.html site/index.html
          touch site/.nojekyll

      # A chave pública do pacote confere a assinatura que acabou de sair.
      - name: Conferir a assinatura
        run: gpgv --keyring "$PWD/packaging/apt/tomatito-archive-keyring.gpg" site/apt/dists/stable/InRelease

      - name: Publicar na gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Repositório APT: ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
