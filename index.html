<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Boot sem clarão (PLANO.md, 4.7): grava data-theme-pref, data-theme e data-platform no <html>
         antes de qualquer folha de estilo, a partir das globais do initialization_script do Rust. -->
    <script>(function(){var h=document.documentElement,w=window,p=w.__TT_PREF__||'lite';
var tomato=location.pathname.indexOf('tomato')>=0;
var base=tomato?'full':(p==='full'?(w.__TT_LAST__||'lite'):p);
var r=base==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):base;
h.dataset.themePref=p;h.dataset.theme=r;h.dataset.platform=w.__TT_PLATFORM__||'web';
if(tomato&&w.__TT_FULL_MODE__==='opaque')h.dataset.fullMode='opaque';})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomatito</title>
    <!-- Ordem da seção 4.2 do plano. O fluent-tokens.gen.css (M11) é gerado pelo
         scripts/build-theme-css.mjs no predev e no prebuild, e fica fora do git. -->
    <link rel="stylesheet" href="/src/styles/fluent-tokens.gen.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/bridge.css" />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/shell.css" />
    <link rel="stylesheet" href="/src/styles/controls.css" />
  </head>
  <body>
    <div class="tt-janela">
      <!-- Barra de título própria (M07): o conteúdo vem do src/components/title-bar.js. -->
      <div class="tt-titlebar" data-tauri-drag-region="deep"></div>
      <div class="tt-corpo">
        <!-- Painel de navegação (M09): o conteúdo, o rótulo e o focusgroup vêm do
             src/components/nav-view.js; a tela, do src/router.js, dentro da
             área que rola (.tt-rolagem), por baixo da camada de conteúdo (M10). -->
        <nav class="tt-nav"></nav>
        <main class="tt-conteudo"><div class="tt-rolagem"></div></main>
      </div>
    </div>
    <!-- Anúncio das fases (M19; PLANO.md, 3.8): a única região aria-live, escondida, preenchida pelo
         src/lib/a11y.js a cada troca de fase. -->
    <div class="tt-anuncio" aria-live="polite" aria-atomic="true" data-anuncio></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
