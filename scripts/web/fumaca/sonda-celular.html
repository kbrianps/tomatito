<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- O viewport da web (PLANO-WEB-V1, 5.1). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Tomatito: sonda de celular</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; font: 16px sans-serif; }
      #altura { position: absolute; top: 0; left: 0; width: 1px; height: 100dvh; }
      #barra { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; padding-bottom: env(safe-area-inset-bottom); background: #888; }
      #teclado { position: fixed; bottom: env(keyboard-inset-height, 0px); width: 1px; height: 1px; }
      #grande { position: absolute; top: 100px; left: 10px; width: 48px; height: 48px; }
      #pequeno { position: absolute; top: 100px; left: 80px; width: 32px; height: 32px; }
      #ampliado { position: absolute; top: 100px; left: 140px; width: 32px; height: 32px; padding: 0; border: 0; box-sizing: border-box; }
      #ampliado::after { content: ''; position: absolute; inset: -8px; }
      #deslizante { position: absolute; top: 200px; left: 20px; width: 300px; height: 48px; touch-action: none; }
      #campo { position: absolute; top: 300px; left: 20px; }
      #lado { position: fixed; top: 0; left: 0; width: 0; padding-left: env(safe-area-inset-left); height: 1px; }
    </style>
  </head>
  <body>
    <div id="altura"></div>
    <button id="grande">48</button>
    <button id="pequeno">32</button>
    <button id="ampliado">32+</button>
    <div id="deslizante" role="slider" aria-label="Deslizante" aria-valuenow="0" tabindex="0"></div>
    <input id="campo" aria-label="Campo" />
    <div id="barra"></div>
    <div id="teclado"></div>
    <div id="lado"></div>
    <script type="module">
      window.toques = [];
      const b = document.getElementById('grande');
      b.addEventListener('pointerdown', (e) => toques.push(`pointerdown:${e.pointerType}`));
      b.addEventListener('touchstart', () => toques.push('touchstart'), { passive: true });
      b.addEventListener('click', (e) => toques.push(`click:${e.pointerType || '?'}`));
      window.arraste = [];
      const d = document.getElementById('deslizante');
      d.addEventListener('touchmove', (e) => arraste.push(Math.round(e.touches[0].clientX)), { passive: true });
    </script>
  </body>
</html>
